[project]
name = "opencall"
version = "0.1.0"
description = "OpenCall Receptionist: a free, self-hosted AI phone receptionist"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local speech stack. Install what your hardware can run.
stt = ["faster-whisper>=1.0"]
vad = ["silero-vad>=5.1"]
tts = ["kokoro>=0.9", "soundfile>=0.12"]
clone = ["coqui-tts>=0.24"]
all = ["opencall[stt,vad,tts,clone]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
opencall = "opencall.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opencall*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
