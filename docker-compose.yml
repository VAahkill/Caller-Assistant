# OpenCall on one machine: the assistant server and a local LLM. Everything here
# is free and runs on your own computer.
#   cp .env.example .env   (then edit it)
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.1:8b
# The Bluetooth phone link needs the host's Bluetooth stack, so for that route
# run the server directly on the host instead (see docs/TELEPHONY.md).
# GSM modem route: docker compose --profile asterisk up -d
services:
  opencall:
    build:
      context: ./backend
      args:
        EXTRAS: stt,vad,tts,clone
    env_file: .env
    environment:
      OPENCALL_LLM_BASE_URL: ${OPENCALL_LLM_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - opencall-data:/data
    ports:
      - "8000:8000"
      - "9092:9092"
    depends_on: [ollama]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach Asterisk ARI on the host
    restart: unless-stopped
    # Uncomment on a machine with an NVIDIA GPU for faster speech models.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  asterisk:
    profiles: [asterisk]
    # Needs Asterisk 20+ with res_audiosocket, app_audiosocket, res_ari,
    # func_curl and the chan_quectel module built in; set ASTERISK_IMAGE to
    # your build (or install Asterisk from your distro instead of Docker).
    image: ${ASTERISK_IMAGE:-opencall-asterisk:local}
    network_mode: host
    devices:
      - /dev/ttyUSB1
      - /dev/ttyUSB2
    volumes:
      - ./deploy/asterisk/quectel.conf:/etc/asterisk/quectel.conf:ro
      - ./deploy/asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./deploy/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./deploy/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./deploy/asterisk/http.conf:/etc/asterisk/http.conf:ro
    restart: unless-stopped

volumes:
  opencall-data:
  ollama:
