# OpenCall on one machine: the assistant server and a local LLM. Everything here
# is free and runs on your own computer.
#   cp .env.example .env   (then edit it)
#   docker compose up -d
# The first start downloads the language model (OPENCALL_LLM_MODEL, about 3 GB);
# follow it with: docker compose logs -f ollama
# The Bluetooth phone link needs the host's Bluetooth stack, so for that route
# run the server directly on the host instead (see docs/TELEPHONY.md).
# GSM modem route: docker compose --profile asterisk up -d
services:
  opencall:
    build:
      context: ./backend
      args:
        EXTRAS: stt-indic,lid,vad,mt,tts,piper,indic,clone
        TORCH_INDEX: ${OPENCALL_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    env_file: .env
    environment:
      OPENCALL_LLM_BASE_URL: ${OPENCALL_LLM_BASE_URL:-http://ollama:11434/v1}
    volumes:
      - opencall-data:/data
    ports:
      - "8000:8000"
      - "9092:9092"
    depends_on: [ollama]
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach Asterisk ARI on the host
    restart: unless-stopped
    # Uncomment on a machine with an NVIDIA GPU for faster speech models, and put
    # OPENCALL_TORCH_INDEX=https://pypi.org/simple in .env before building, which
    # installs PyTorch with GPU support.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  ollama:
    image: ollama/ollama
    # Starts Ollama, then pulls the model the server uses if it isn't there yet
    # (only when the server talks to this Ollama, not to a cloud LLM).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        trap 'kill $$server' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        case "$$OPENCALL_LLM_BASE_URL" in
          *ollama:11434*)
            ollama show "$$OPENCALL_LLM_MODEL" >/dev/null 2>&1 ||
              ollama pull "$$OPENCALL_LLM_MODEL" ||
              echo "Couldn't pull $$OPENCALL_LLM_MODEL; the server will keep asking for it. Check the name and your internet connection."
            ;;
        esac
        wait $$server
    environment:
      OPENCALL_LLM_MODEL: ${OPENCALL_LLM_MODEL:-qwen3:4b-instruct}
      OPENCALL_LLM_BASE_URL: ${OPENCALL_LLM_BASE_URL:-http://ollama:11434/v1}
      # Keep the model in memory between calls. Ollama unloads it after 5 idle
      # minutes by default, and reloading it on a CPU makes the next caller wait.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
      # One call at a time: one copy of the model's working memory, and the call
      # prompt stays in its cache between calls. 8192 tokens is plenty for a call.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  asterisk:
    profiles: [asterisk]
    # Needs Asterisk 20+ with res_audiosocket, app_audiosocket, res_ari,
    # func_curl and the chan_quectel module built in; set ASTERISK_IMAGE to
    # your build (or install Asterisk from your distro instead of Docker).
    image: ${ASTERISK_IMAGE:-opencall-asterisk:local}
    network_mode: host
    devices:
      - /dev/ttyUSB1
      - /dev/ttyUSB2
    volumes:
      - ./deploy/asterisk/quectel.conf:/etc/asterisk/quectel.conf:ro
      - ./deploy/asterisk/manager.conf:/etc/asterisk/manager.conf:ro
      - ./deploy/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./deploy/asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./deploy/asterisk/http.conf:/etc/asterisk/http.conf:ro
    restart: unless-stopped

volumes:
  opencall-data:
  ollama:
