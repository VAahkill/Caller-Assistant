; Lets OpenCall text map links to delivery partners through the GSM modem
; (it runs chan_quectel's "quectel sms" command). OpenCall reaches it from its
; Docker container, so listen on all interfaces but only permit local and
; Docker addresses, and block port 5038 from the internet in your firewall.
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0

[opencall]
secret = change-me-three      ; same as OPENCALL_ASTERISK_AMI_PASSWORD
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 172.16.0.0/255.240.0.0
read = system
write = command
