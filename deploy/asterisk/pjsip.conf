; SIP trunk to your VoIP provider. Replace the values in <...> with the ones
; from your provider's "SIP credentials" page. Any provider that gives you a
; phone number (DID) with SIP registration works.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[trunk]
type = registration
outbound_auth = trunk-auth
server_uri = sip:<sip.provider.example>
client_uri = sip:<username>@<sip.provider.example>
retry_interval = 60

[trunk-auth]
type = auth
auth_type = userpass
username = <username>
password = <password>

[trunk]
type = aor
contact = sip:<sip.provider.example>

[trunk]
type = endpoint
context = opencall-inbound
disallow = all
allow = ulaw,alaw
outbound_auth = trunk-auth
aors = trunk
from_user = <username>
from_domain = <sip.provider.example>
direct_media = no

[trunk-identify]
type = identify
endpoint = trunk
match = <sip.provider.example>
