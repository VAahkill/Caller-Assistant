; OpenCall dialplan. Calls your carrier forwards to the SIP number arrive in
; [opencall-inbound]; calls OpenCall places for you run [opencall-outbound].

[globals]
OPENCALL_HTTP=http://127.0.0.1:8000
OPENCALL_AUDIOSOCKET=127.0.0.1:9092
OPENCALL_TOKEN=change-me            ; same value as OPENCALL_API_TOKEN

[opencall-inbound]
exten => _X.,1,NoOp(OpenCall inbound from ${CALLERID(num)})
 same => n,Set(OC_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 ; Ask OpenCall whether to answer: it blocks spam series, international numbers
 ; and blocked contacts before the call is even picked up.
 same => n,Set(OC_DECISION=${CURL(${OPENCALL_HTTP}/telephony/asterisk/screen?uuid=${OC_UUID}&number=${URIENCODE(${CALLERID(num)})}&token=${OPENCALL_TOKEN})})
 same => n,GotoIf($["${OC_DECISION}" = "answer"]?answer)
 same => n,Hangup(21)
 same => n(answer),Answer()
 same => n,AudioSocket(${OC_UUID},${OPENCALL_AUDIOSOCKET})
 same => n,Hangup()

[opencall-outbound]
; ARI originates PJSIP/<number>@trunk into this context once the callee answers.
exten => s,1,NoOp(OpenCall outbound ${OPENCALL_UUID})
 same => n,AudioSocket(${OPENCALL_UUID},${OPENCALL_AUDIOSOCKET})
 same => n,Hangup()
