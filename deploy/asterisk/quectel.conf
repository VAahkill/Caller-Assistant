; chan_quectel: a USB GSM/LTE modem with an ordinary SIM card becomes the
; assistant's phone line. No VoIP provider, no monthly fee beyond the SIM.
; Driver and full sample config: https://github.com/IchthysMaranatha/asterisk-chan-quectel
; Check that sample for the exact keys your modem needs (UAC vs serial audio).

[general]
interval=15

[defaults]
context=opencall-inbound      ; incoming calls go to the OpenCall dialplan
group=0
rxgain=0
txgain=0
resetquectel=yes
callwaiting=auto
initstate=start

[quectel0]
; Serial ports the modem exposes (ls /dev/ttyUSB*). Typical for EC25 / SIM7600:
data=/dev/ttyUSB2
audio=/dev/ttyUSB1
; Newer modems carry audio over USB Audio Class instead of a serial port:
; quec_uac=1
; alsadev=hw:Android
